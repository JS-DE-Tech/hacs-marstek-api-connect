set_mode:
  name: Set operating mode
  description: Set and persist the desired operating mode of one Marstek Venus E.
  fields:
    config_entry_id: &config_entry
      name: Device
      description: Marstek configuration entry that owns the target device.
      required: true
      selector:
        config_entry:
          integration: hacs_marstek_api_connect
    mode:
      name: Mode
      description: Persistent user-facing operating-mode setpoint.
      required: true
      selector:
        select:
          translation_key: operating_mode_options
          options:
            - Auto
            - AI
            - Standby
            - Manual
            - Schedule
            - Storage

set_manual_schedule:
  name: Set manual schedule
  description: Configure one charging or discharging schedule without changing the persistent operating-mode setpoint.
  fields:
    config_entry_id: *config_entry
    time_num:
      name: Time slot number
      description: Time slot number from 0 to 9.
      required: true
      selector:
        number:
          min: 0
          max: 9
          step: 1
          mode: slider
    start_time:
      name: Start time
      required: true
      selector:
        time:
    end_time:
      name: End time
      description: Must be later than the start time.
      required: true
      selector:
        time:
    week_set:
      name: Days of week
      description: Bitmask from 1 to 127; 127 represents every day.
      required: true
      selector:
        number:
          min: 1
          max: 127
          step: 1
          mode: box
    mode:
      name: Direction
      required: true
      default: discharging
      selector:
        select:
          translation_key: schedule_direction
          options:
            - charging
            - discharging
    power:
      name: Power
      description: Positive power magnitude from 100 to 2500 W.
      required: true
      selector:
        number:
          min: 100
          max: 2500
          step: 10
          unit_of_measurement: W
          mode: box
    enable:
      name: Enable schedule
      required: false
      default: true
      selector:
        boolean:

clear_all_schedules:
  name: Clear all manual schedules
  description: Disable all ten manual charging and discharging schedule slots.
  fields:
    config_entry_id: *config_entry

set_ble_adv:
  name: Control Bluetooth advertising
  description: Enable or disable Bluetooth advertising on one device.
  fields:
    config_entry_id: *config_entry
    enable:
      name: Enable
      required: true
      selector:
        boolean:

set_led_ctrl:
  name: Control panel LED
  description: Turn the device panel LED on or off and update the Home Assistant switch state.
  fields:
    config_entry_id: *config_entry
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:
